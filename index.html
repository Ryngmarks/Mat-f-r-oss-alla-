<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f2">
  <title>Mat för oss alla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h2 class="dialog__title">Ta bort maträtten?</h2>
      <p class="dialog__text">Den försvinner från biblioteket. Det går inte att ångra.</p>
      <div class="dialog__actions">
        <button value="cancel" class="btn btn--ghost">Avbryt</button>
        <button value="ok" class="btn btn--danger">Ta bort</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
